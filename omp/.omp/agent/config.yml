symbolPreset: ascii
colorBlindMode: true
setupVersion: 2
theme:
  dark: dark-catppuccin
  light: light-catppuccin
modelRoles:
  default: opencode-go/glm-5.3-flash:high
  smol: opencode-go/glm-5.3-flash:low
  tiny: opencode-go/glm-5.3-flash:low
  task: opencode-go/kimi-k2.7-code:high
  commit: opencode-go/glm-5.3-flash:high
  plan: openai-codex/gpt-5.6-terra:high
  slow: openai-codex/gpt-5.6-sol:xhigh
  advisor: openai-codex/gpt-5.6-terra:xhigh
  vision: openai-codex/gpt-5.6-terra:medium
statusLine:
  preset: ascii
  separator: ascii
dev:
  autoqaConsent: denied
tools:
  approvalMode: write
  approval:
    # General safety
    bash: prompt
    delete: deny
    eval: deny
    read: allow
    mcp__filesystem_delete: deny

    # omp commit — inspection
    git_overview: allow
    git_file_diff: allow
    git_hunk: allow

    # omp commit — structured proposals
    propose_commit: allow
    split_commit: allow
    propose_changelog: allow
bash:
  patterns:
    - match: "git status*"
      approval: allow
    - match: "git diff*"
      approval: allow
    - match: "git log*"
      approval: allow
    - match: "git show*"
      approval: allow
    - match: "curl *"
      approval: prompt
    - match: "rm -rf *"
      approval: deny
composer:
  shape: box
