##### ~/.tmux.conf ##############################################################
# Core options
###############################################################################

# History
set -g history-limit 10000

# Default shell
set -g default-shell /bin/zsh

# Prefix: Ctrl-a (replace default Ctrl-b)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Make Escape key / key-chords feel snappier
set -sg escape-time 0


###############################################################################
# Key bindings
###############################################################################

# Reload config
bind r source-file ~/.tmux.conf \; display-message "~/.tmux.conf reloaded!"

# New window
bind N new-window

# Synchronize panes in a window (toggle)
bind y setw synchronize-panes

# Pane movement (vim-like)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R


###############################################################################
# Mouse
###############################################################################
set -g mouse on


###############################################################################
# Copy mode (vi)
###############################################################################

# Use vi keys in copy-mode
setw -g mode-keys vi

# Enter copy-mode with Escape
unbind [
bind Escape copy-mode

# Copy selection with 'y' in copy-mode-vi
bind-key -T copy-mode-vi y send-keys -X copy-selection

# Paste with 'p'
unbind p
bind p paste-buffer


###############################################################################
# Terminal / Color
###############################################################################

# 256-color + true color (Tc) when supported
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"


###############################################################################
# Plugins (TPM)
###############################################################################

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Keep this at the very bottom
run '~/.tmux/plugins/tpm/tpm'
