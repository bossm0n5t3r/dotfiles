##### ~/.tmux.conf ##############################################################
# Core options
###############################################################################

# History
set -g history-limit 10000

# Default shell
set -g default-shell /bin/zsh

# Prefix: Ctrl-a (replace default Ctrl-b)
unbind C-b
set -g prefix C-a
bind-key C-a send-prefix

# Escape delay (10ms)
set -sg escape-time 10


###############################################################################
# Terminal / Color
###############################################################################

# Prefer tmux terminfo (more modern default)
set -g default-terminal "tmux-256color"

# True color override for xterm-256color
set -ag terminal-overrides ",xterm-256color:RGB"


###############################################################################
# Key bindings
###############################################################################

# Reload config
unbind r
bind r source-file ~/.tmux.conf

# New window
bind N new-window

# Synchronize panes in a window (toggle)
bind y setw synchronize-panes

# Split panes
unbind %
bind | split-window -h

unbind '"'
bind - split-window -v

# Resize panes with h/j/k/l
bind j resize-pane -D 5
bind k resize-pane -U 5
bind l resize-pane -R 5
bind h resize-pane -L 5

# Toggle zoom
bind -r m resize-pane -Z

# Attach session in current pane path
bind M-c attach-session -c "#{pane_current_path}"


###############################################################################
# Mouse
###############################################################################
set -g mouse on


###############################################################################
# Copy mode (vi)
###############################################################################

# Use vi keys in copy-mode
set-window-option -g mode-keys vi

# Enter copy-mode with Escape
unbind [
bind Escape copy-mode

# Start selection with 'v' and copy with 'y'
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-selection

# Keep copy-mode when finishing mouse drag
unbind -T copy-mode-vi MouseDragEnd1Pane

# Paste with 'p'
unbind p
bind p paste-buffer


###############################################################################
# Plugins (TPM)
###############################################################################

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

set -g @plugin 'christoomey/vim-tmux-navigator'

# Catppuccin theme (Mocha)
set -g @plugin 'catppuccin/tmux'
set -g @catppuccin_flavor 'mocha'  # latte | frappe | macchiato | mocha

set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

# Initialize TMUX plugin manager (keep this line at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
